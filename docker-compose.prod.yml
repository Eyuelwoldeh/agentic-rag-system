# Production stack: Postgres (pgvector), API, background worker, web.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Environment (in .env.prod):
#   POSTGRES_PASSWORD   required. Password for the `rag` database user.
#   SECRETS_KEY         required. Encrypts stored tokens and API keys. Generate once and back it up:
#                       python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   PUBLIC_URL          required. Public URL of the API, e.g. https://api.example.com (https turns on secure cookies).
#   FRONTEND_URL        required. Public URL of the web app, e.g. https://rag.example.com (CORS and redirects).
#   ANTHROPIC_API_KEY   optional. Can also be set in Settings, AI model.
#   OPENAI_API_KEY      optional. Same.
#   AGENT_MODEL, CRITIC_MODEL, OPENAI_MODEL   optional model overrides.
#   SYNC_INTERVAL_MINUTES   optional, default 30. How often connectors re-sync (0 turns it off).
#   DB_POOL_MAX         optional, default 10. Database connections per process.
#   WORKER_CONCURRENCY  optional, default 2. Jobs each worker runs at once.
#
# Only the web (3000) and API (8000) ports are published; put a TLS-terminating proxy in front of both.
# The database is reachable only inside this network. Migrations run automatically when the API or worker starts.

x-backend: &backend
  image: agentic-rag-api
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &backend-env
    DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/rag
    # Read-only role created by db/migrations/001_init.sql (SELECT on schema `data` only).
    READER_DATABASE_URL: postgresql://rag_reader:rag_reader@db:5432/rag
    SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY}
    PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
    FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
    CRITIC_MODEL: ${CRITIC_MODEL:-claude-haiku-5-5}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
    SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
    DB_POOL_MAX: ${DB_POOL_MAX:-10}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    WORKER_MODE: external  # the API only queues jobs; the worker service runs them

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true  # no HTTP server; GET /api/health on the API reports the worker heartbeat

  web:
    image: agentic-rag-web
    restart: unless-stopped
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?set PUBLIC_URL}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
