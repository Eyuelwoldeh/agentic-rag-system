[project]
name = "agentic-rag-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "google-auth>=2.62.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
